<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des remontées d’information</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14213d; --muted: #6b7385;
    --line: #d9dde5; --accent: #1f4fd8; --accent-ink: #fff; --sel: #e8eefc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --panel: #1a2029; --ink: #e8ecf4; --muted: #93a0b8;
            --line: #2b3442; --accent: #5b8cff; --accent-ink: #0b1220; --sel: #223055; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); display: flex; flex-direction: column; padding: 12px; gap: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 16px; }
  .tabs-wrap { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .tabs { position: relative; display: inline-flex; padding: 4px; border: 1px solid var(--line);
          border-radius: 999px; background: var(--panel); white-space: nowrap; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted);
          font: inherit; font-weight: 600; padding: 7px 18px; border-radius: 999px; cursor: pointer;
          transition: color .2s; }
  .tabs button[aria-selected="true"] { color: var(--accent-ink); }
  .tabs button:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px;
           background: var(--accent); transition: transform .25s ease, width .25s ease; }
  .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .chk input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .chk input:disabled { cursor: not-allowed; opacity: .4; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0;
           display: flex; flex-direction: column; overflow: hidden; }
  .panel > h2 { margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--muted);
           border-bottom: 1px solid var(--line); }
  .right { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
  .text { padding: 10px 12px; overflow: auto; white-space: pre-wrap; flex: 1; }
  .empty { color: var(--muted); font-style: italic; }
  .tbl { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 8px 12px;
       font-size: 13px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--sel); }
  tbody tr.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  td.date { white-space: nowrap; }
  .msg { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; overflow: auto; }
    .right { grid-template-rows: auto auto; }
    .text { min-height: 90px; }
    .bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <h1>Suivi des remontées d’information</h1>

  <div class="bar">
    <div class="tabs-wrap">
      <div class="tabs" id="tabs" role="tablist" aria-label="Filtrer par type"><span class="thumb" id="thumb"></span></div>
    </div>
    <label class="chk"><input type="checkbox" id="saisie"> Saisie</label>
  </div>

  <div class="msg" id="warn" hidden style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)"></div>
  <div class="main">
    <section class="panel">
      <div class="tbl">
        <table>
          <thead><tr><th>Date</th><th>Collaborateur</th><th>Lieu - Chantier</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="msg" id="msg" hidden></div>
      </div>
    </section>
    <div class="right">
      <section class="panel"><h2>Description des faits</h2><div class="text" id="desc"></div></section>
      <section class="panel"><h2>Proposition d’amélioration</h2><div class="text" id="prop"></div></section>
    </div>
  </div>

<script>
const COLS = [
  { name: "Type",        title: "Type",                   type: "Choice,Text,Any", description: "Colonne Choix unique servant de filtre" },
  { name: "Collaborateur", title: "Collaborateur",        type: "Any" },
  { name: "Lieu",        title: "Lieu - Chantier",        type: "Any" },
  { name: "Date",        title: "Date de l’évènement",    type: "Date,DateTime,Any" },
  { name: "Description", title: "Description des faits",  type: "Text,Any" },
  { name: "Proposition", title: "Proposition d’amélioration", type: "Text,Any" },
  { name: "Saisie",      title: "Saisie",                 type: "Bool" }
];

let records = [], filter = "__ALL__", selectedId = null, mapped = true;
const $ = id => document.getElementById(id);

// Convertit n’importe quelle valeur Grist en texte lisible
function txt(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  if (Array.isArray(v)) {
    if (v[0] === "L") v = v.slice(1);
    else if (v[0] === "D" || v[0] === "d") return fmtDate(v[1]);
    return v.map(txt).filter(Boolean).join(", ");
  }
  if (typeof v === "object") return txt(v.details ?? v.display ?? v.name ?? v.value ?? "");
  return String(v);
}
function fmtDate(v) {
  if (v === null || v === undefined || v === "") return "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  if (typeof v === "number") return new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" });
  if (Array.isArray(v) && (v[0] === "D" || v[0] === "d")) return fmtDate(v[1]);
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v.slice(0, 10) + "T00:00:00Z").toLocaleDateString("fr-FR", { timeZone: "UTC" });
  return txt(v);
}
const isTrue = v => v === true || v === 1 || v === "true";

function types() {
  return [...new Set(records.map(r => txt(r.Type)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
}

function renderTabs() {
  const el = $("tabs"), list = [["__ALL__", "TOUS"], ...types().map(t => [t, t])];
  if (filter !== "__ALL__" && !list.some(([k]) => k === filter)) filter = "__ALL__";
  [...el.querySelectorAll("button")].forEach(b => b.remove());
  for (const [key, label] of list) {
    const b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.textContent = label; b.dataset.key = key;
    b.setAttribute("aria-selected", key === filter);
    b.onclick = () => { filter = key; selectedId = null; render(); };
    el.appendChild(b);
  }
  moveThumb();
}
function moveThumb() {
  const b = $("tabs").querySelector('button[aria-selected="true"]'), t = $("thumb");
  if (!b) { t.style.width = "0"; return; }
  t.style.width = b.offsetWidth + "px";
  t.style.transform = `translateX(${b.offsetLeft}px)`;
  b.scrollIntoView({ inline: "nearest", block: "nearest" });
}

function visible() {
  const wanted = $("saisie").checked;
  return records.filter(r => (filter === "__ALL__" || txt(r.Type) === filter) && isTrue(r.Saisie) === wanted);
}

function renderRows() {
  const rows = visible(), tb = $("rows");
  tb.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = r.id === selectedId ? "sel" : "";
    tr.innerHTML = `<td class="date"></td><td></td><td></td>`;
    tr.children[0].textContent = fmtDate(r.Date);
    tr.children[1].textContent = txt(r.Collaborateur);
    tr.children[2].textContent = txt(r.Lieu);
    tr.onclick = () => { selectedId = r.id; grist.setCursorPos({ rowId: r.id }); renderRows(); renderDetail(); };
    tb.appendChild(tr);
  }
  const m = $("msg");
  m.hidden = rows.length > 0;
  m.textContent = records.length ? "Aucune remontée avec ces filtres." : "Aucune donnée.";
}

function setText(el, v) {
  const s = txt(v);
  el.textContent = s;
  el.classList.toggle("empty", !s);
  if (!s) el.textContent = selectedId ? "—" : "Sélectionnez une ligne.";
}
function renderDetail() {
  const r = records.find(x => x.id === selectedId);
  setText($("desc"), r && r.Description);
  setText($("prop"), r && r.Proposition);
}

function checkMapping() {
  const w = $("warn"), missing = [];
  if (records.length) for (const c of COLS) if (records.every(r => r[c.name] === undefined)) missing.push(c.title);
  w.hidden = !missing.length;
  w.textContent = missing.length ? "Colonnes non reçues (vérifiez l’association dans le panneau du widget) : " + missing.join(", ") : "";
}
function render() {
  if (selectedId !== null && !visible().some(r => r.id === selectedId)) selectedId = null;
  checkMapping(); renderTabs(); renderRows(); renderDetail();
}

$("saisie").onchange = () => { selectedId = null; render(); };

grist.ready({ columns: COLS, requiredAccess: "read table", allowSelectBy: true });

grist.onRecords(recs => {
  mapped = !!(recs && recs.length === 0) || !!(recs && recs[0] && "Type" in recs[0]);
  records = (recs || []).filter(r => r && r.id !== undefined);
  if (selectedId !== null && !records.some(r => r.id === selectedId)) selectedId = null;
  render();
}, { mapColumnNames: true });

// Suit le curseur Grist (utile si le widget est lié à une autre vue)
grist.onRecord(rec => {
  if (rec && rec.id && rec.id !== selectedId) {
    selectedId = rec.id;
    render();
  }
}, { mapColumnNames: true });

window.addEventListener("resize", moveThumb);
</script>
</body>
</html>
