<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des remontées d’informations</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14213d; --muted: #6b7385;
    --line: #d9dde5; --head: #eceef1; --mint: #e3f4e7; --accent: #1f4fd8; --accent-ink: #fff; --sel: #e8eefc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --panel: #1a2029; --ink: #e8ecf4; --muted: #93a0b8;
            --line: #2b3442; --head: #262e3a; --mint: #1f3a2b; --accent: #5b8cff; --accent-ink: #0b1220; --sel: #223055; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); display: flex; flex-direction: column; padding: 12px; gap: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 16px; }
  .tabs-wrap { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .tabs { position: relative; display: inline-flex; padding: 4px; border: 1px solid var(--line);
          border-radius: 999px; background: var(--panel); white-space: nowrap; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted);
          font: inherit; font-weight: 600; padding: 7px 18px; border-radius: 999px; cursor: pointer;
          transition: color .2s; }
  .tabs button[aria-selected="true"] { color: var(--accent-ink); }
  .tabs button:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px;
           background: var(--accent); transition: transform .25s ease, width .25s ease; }
  .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .chk input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .chk input:disabled { cursor: not-allowed; opacity: .4; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 0.8fr) minmax(300px, 1.2fr); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0;
           display: flex; flex-direction: column; overflow: hidden; }
  .panel > h2 { background: var(--head); margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--muted);
           border-bottom: 1px solid var(--line); }
  .right { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
  .text { padding: 10px 12px; overflow: auto; white-space: pre-wrap; flex: 1; }
  .empty { color: var(--muted); font-style: italic; }
  .tbl { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--head); text-align: left; padding: 8px 12px;
       font-size: 13px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--sel); }
  tbody tr.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  table { table-layout: fixed; }
  th.c-date, td.date { width: 106px; white-space: nowrap; }
  th.c-collab { width: calc((100% - 214px) / 2 - 24px); }
  th.c-ri, td.ri { width: 44px; text-align: center; font-weight: 600; }
  th.c-sw, td.sw { width: 64px; text-align: center; }
  td { overflow: hidden; text-overflow: ellipsis; }
  th, td { padding: 8px 8px; }
  .search { width: 100%; padding: 8px 12px; font: inherit; color: var(--ink); background: var(--mint);
            border: 1px solid var(--line); border-radius: 8px; }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sw label { display: inline-block; position: relative; width: 36px; height: 20px; cursor: pointer; vertical-align: middle; }
  .sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sw .knob { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
  .sw .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                     background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sw input:checked + .knob { background: var(--accent); }
  .sw input:checked + .knob::after { transform: translateX(16px); }
  .sw input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; overflow: auto; }
    .right { grid-template-rows: auto auto; }
    .text { min-height: 90px; }
    .bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <h1>Suivi des remontées d’informations</h1>

  <div class="bar">
    <div class="tabs-wrap">
      <div class="tabs" id="tabs" role="tablist" aria-label="Filtrer par type"><span class="thumb" id="thumb"></span></div>
    </div>
    <label class="chk" title="Cochée : affiche toutes les lignes. Décochée : masque les lignes déjà saisies."><input type="checkbox" id="saisie"> Saisies</label>
  </div>

  <input type="search" class="search" id="q" placeholder="Rechercher..." aria-label="Rechercher">
  <div class="msg" id="warn" hidden style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)"></div>
  <div class="main">
    <section class="panel">
      <div class="tbl">
        <table>
          <thead><tr><th class="c-date">Date</th><th class="c-ri">RI</th><th class="c-collab">Collaborateur</th><th>Lieu - Chantier</th><th class="c-sw">Saisie</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="msg" id="msg" hidden></div>
      </div>
    </section>
    <div class="right">
      <section class="panel"><h2>Description des faits</h2><div class="text" id="desc"></div></section>
      <section class="panel"><h2>Proposition d’amélioration</h2><div class="text" id="prop"></div></section>
    </div>
  </div>

<script>
// Détection automatique des colonnes d’après leur nom (accents et ponctuation ignorés)
const FIELDS = [
  ["Type",          "Type",                     k => k.startsWith("type")],
  ["RI",            "RI",                       k => k === "ri"],
  ["Collaborateur", "Collaborateur",            k => k.startsWith("collab")],
  ["Lieu",          "Lieu - Chantier",          k => k.includes("lieu") || k.includes("chantier")],
  ["Date",          "Date de l’évènement",      k => k.startsWith("date")],
  ["Description",   "Description des faits",    k => k.startsWith("descr")],
  ["Proposition",   "Proposition d’amélioration", k => k.startsWith("propos")],
  ["Saisie",        "Saisie",                   k => k.startsWith("saisi")]
];
const norm0 = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
let missingFields = [], knownKeys = [], saisieKey = null, labels = {}, rawRecs = [];
function normalize(raw) {
  const keys = Object.keys(raw[0] || {}).filter(k => k !== "id" && !k.startsWith("gristHelper_"));
  knownKeys = keys.map(k => labels[k] && labels[k] !== k ? `${k} (${labels[k]})` : k);
  const map = {}; missingFields = [];
  for (const [f, title, test] of FIELDS) {
    const k = keys.find(k => !Object.values(map).includes(k) && (test(norm(k)) || (labels[k] && test(norm(labels[k])))));
    if (k) map[f] = k; else missingFields.push(title);
  }
  saisieKey = map.Saisie || null;
  return raw.map(r => {
    const o = { id: r.id };
    for (const f in map) o[f] = r[map[f]];
    o._hay = norm0(keys.filter(k => k !== saisieKey).map(k => k === map.Date ? fmtDate(r[k]) : txt(r[k])).join(" "));
    return o;
  });
}

let records = [], filter = "__ALL__", selectedId = null, mapped = true;
const $ = id => document.getElementById(id);

// Convertit n’importe quelle valeur Grist en texte lisible
function txt(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  if (Array.isArray(v)) {
    if (v[0] === "L") v = v.slice(1);
    else if (v[0] === "D" || v[0] === "d") return fmtDate(v[1]);
    return v.map(txt).filter(Boolean).join(", ");
  }
  if (typeof v === "object") return txt(v.details ?? v.display ?? v.name ?? v.value ?? "");
  return String(v);
}
function fmtDate(v) {
  if (v === null || v === undefined || v === "") return "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  if (typeof v === "number") return new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" });
  if (Array.isArray(v) && (v[0] === "D" || v[0] === "d")) return fmtDate(v[1]);
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v.slice(0, 10) + "T00:00:00Z").toLocaleDateString("fr-FR", { timeZone: "UTC" });
  return txt(v);
}
const isTrue = v => v === true || v === 1 || v === "true";

function types() {
  return [...new Set(records.map(r => txt(r.Type)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
}

function renderTabs() {
  const el = $("tabs"), list = [["__ALL__", "TOUS"], ...types().map(t => [t, t])];
  if (filter !== "__ALL__" && !list.some(([k]) => k === filter)) filter = "__ALL__";
  [...el.querySelectorAll("button")].forEach(b => b.remove());
  for (const [key, label] of list) {
    const b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.textContent = label; b.dataset.key = key;
    b.setAttribute("aria-selected", key === filter);
    b.onclick = () => { filter = key; selectedId = null; render(); };
    el.appendChild(b);
  }
  moveThumb();
}
function moveThumb() {
  const b = $("tabs").querySelector('button[aria-selected="true"]'), t = $("thumb");
  if (!b) { t.style.width = "0"; return; }
  t.style.width = b.offsetWidth + "px";
  t.style.transform = `translateX(${b.offsetLeft}px)`;
  b.scrollIntoView({ inline: "nearest", block: "nearest" });
}

function visible() {
  const showAll = $("saisie").checked;
  const terms = norm0($("q").value.trim()).split(/\s+/).filter(Boolean);
  return records.filter(r => terms.every(t => r._hay.includes(t)) && (filter === "__ALL__" || txt(r.Type) === filter) && (showAll || !isTrue(r.Saisie)));
}

function renderRows() {
  const rows = visible(), tb = $("rows");
  tb.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = r.id === selectedId ? "sel" : "";
    tr.innerHTML = `<td class="date"></td><td class="ri"></td><td></td><td></td><td class="sw"><label><input type="checkbox" aria-label="Saisie"><span class="knob"></span></label></td>`;
    tr.children[0].textContent = fmtDate(r.Date);
    tr.children[1].textContent = txt(r.RI);
    tr.children[2].textContent = txt(r.Collaborateur);
    tr.children[3].textContent = txt(r.Lieu);
    const cb = tr.querySelector("input");
    cb.checked = isTrue(r.Saisie);
    cb.disabled = !saisieKey;
    tr.querySelector(".sw").onclick = e => e.stopPropagation();
    cb.onchange = async () => {
      const value = cb.checked, old = r.Saisie;
      r.Saisie = value;
      try { await grist.getTable().update({ id: r.id, fields: { [saisieKey]: value } }); }
      catch (err) { r.Saisie = old; cb.checked = isTrue(old); alert("Mise à jour impossible : " + err.message); }
      render();
    };
    tr.onclick = () => { selectedId = r.id; grist.setCursorPos({ rowId: r.id }); renderRows(); renderDetail(); };
    tb.appendChild(tr);
  }
  const m = $("msg");
  m.hidden = rows.length > 0;
  m.textContent = records.length ? "Aucune remontée avec ces filtres." : "Aucune donnée.";
}

function setText(el, v) {
  const s = txt(v);
  el.textContent = s;
  el.classList.toggle("empty", !s);
  if (!s) el.textContent = selectedId ? "—" : "Sélectionnez une ligne.";
}
function renderDetail() {
  const r = records.find(x => x.id === selectedId);
  setText($("desc"), r && r.Description);
  setText($("prop"), r && r.Proposition);
}

function checkMapping() {
  const w = $("warn");
  w.hidden = !(records.length && missingFields.length);
  w.textContent = w.hidden ? "" : "Colonnes introuvables : " + missingFields.join(", ") + ". Colonnes de la table : " + knownKeys.join(", ");
}
function render() {
  if (selectedId !== null && !visible().some(r => r.id === selectedId)) selectedId = null;
  checkMapping(); renderTabs(); renderRows(); renderDetail();
}

$("saisie").onchange = () => { selectedId = null; render(); };
$("q").oninput = () => { selectedId = null; render(); };

grist.ready({ requiredAccess: "full" });

grist.onRecords(recs => {
  rawRecs = (recs || []).filter(r => r && r.id !== undefined);
  records = normalize(rawRecs);
  render();
});

// Récupère les libellés des colonnes (au cas où l’identifiant diffère du titre, ex. « RI »)
(async () => {
  try {
    const tid = await grist.selectedTable.getTableId();
    const tabs = await grist.docApi.fetchTable("_grist_Tables");
    const ref = tabs.id[tabs.tableId.indexOf(tid)];
    const cols = await grist.docApi.fetchTable("_grist_Tables_column");
    cols.colId.forEach((c, i) => { if (cols.parentId[i] === ref) labels[c] = cols.label[i]; });
    if (rawRecs.length) { records = normalize(rawRecs); render(); }
  } catch (e) { console.warn("Libellés indisponibles", e); }
})();

grist.onRecord(rec => {
  if (rec && rec.id && rec.id !== selectedId && visible().some(r => r.id === rec.id)) {
    selectedId = rec.id; renderRows(); renderDetail();
  }
});

window.addEventListener("resize", moveThumb);
</script>
</body>
</html>
