<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manomètres</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #1c2833;
    --muted: #66788a;
    --line: #dbe2e8;
    --accent: #0b6e8a;
    --accent-soft: #dff1f6;
    --green: #2e9e4f;
    --search-bg: #e2f5e0; --search-line: #b9dfb5;
    --bad-bg: #fcd5d5; --bad-ink: #8a1c1c;
    --dot-orange: #f08c00; --dot-red: #d62f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b21; --panel: #1d252d; --ink: #e6ecf1; --muted: #8fa1b2;
      --line: #2f3b46; --accent: #4cc3e0; --accent-soft: #1d3a45;
      --green: #3fbf63;
      --search-bg: #24402b; --search-line: #35603f;
      --bad-bg: #4a2323; --bad-ink: #f5a6a6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; min-height: 0;
  }
  aside {
    width: 190px; flex: none; padding: 14px 10px;
    border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto;
  }
  aside h2 { font-size: 15px; margin: 0 0 12px; padding: 0 0 10px; text-align: center; border-bottom: 1px solid var(--line); }
  .plage {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 8px 12px; margin-bottom: 4px;
    border: 1.5px solid transparent; border-radius: 999px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .plage:hover { background: var(--accent-soft); }
  .plage[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .plage:focus-visible, .search:focus-visible, .pdf:focus-visible, .sw input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .plage .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .plage.vide { color: var(--muted); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 16px; }
  .bar h1 { font-size: 16px; margin: 0; flex: 1; }
  .search {
    padding: 6px 10px; border: 1px solid var(--search-line); border-radius: 6px;
    background: var(--search-bg); color: inherit; font: inherit; width: 250px;
  }
  /* Interrupteur */
  .sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; white-space: nowrap; }
  .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track { width: 38px; height: 22px; border-radius: 999px; background: #b7c2cc; position: relative; transition: background .15s; flex: none; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + .track { background: var(--green); }
  .sw input:checked + .track::after { transform: translateX(16px); }
  @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }

  .wrap { flex: 1; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); border-bottom: 2px solid var(--line); font-weight: 600; z-index: 1; }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--accent-soft); }
  tr.sel { background: var(--accent-soft); }
  td.ref { font-weight: 600; font-variant-numeric: tabular-nums; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; background: var(--line); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-ink); }
  th.mini, td.mini { width: 1%; padding-left: 8px; padding-right: 8px; text-align: center; }
  th.mini svg { vertical-align: middle; color: var(--muted); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
  .dot.orange { background: var(--dot-orange); }
  .dot.red { background: var(--dot-red); }
  .clip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border: 0; border-radius: 4px; background: none;
    color: var(--accent); cursor: pointer; padding: 0;
  }
  .clip:hover { background: var(--accent-soft); }
  .clip svg, th.mini svg { width: 16px; height: 16px; }
  /* Visionneuse */
  #viewer { position: fixed; inset: 0; background: rgba(10, 16, 22, .6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #viewer[hidden] { display: none; }
  .v-box { background: var(--panel); border-radius: 8px; width: min(960px, 100%); height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .v-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .v-head .nom { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; font: inherit; cursor: pointer; text-decoration: none; }
  .v-btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  .v-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .v-body { flex: 1; min-height: 0; background: #888; }
  .v-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .v-body .err { padding: 24px; color: #fff; }
  /* Fiche détail */
  .dlg { position: fixed; inset: 0; background: rgba(10, 16, 22, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .dlg.z6 { z-index: 6; }
  .dlg.z7 { z-index: 7; }
  .dlg[hidden] { display: none; }
  .card { background: var(--panel); border-radius: 10px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .card.small { width: min(420px, 100%); }
  .card h2 { margin: 0; font-size: 20px; }
  .f-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
  .fld { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
  .fld input, .fld select, .fld textarea { font: inherit; font-size: 14px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .fld input[readonly] { background: var(--bg); }
  .fld input.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .fld.edit input, .fld.edit select, .fld.edit textarea { border-color: var(--accent); }
  .fld textarea { min-height: 110px; resize: vertical; width: 100%; }
  .fld input:focus-visible, .fld select:focus-visible, .fld textarea:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fld .clips { display: flex; gap: 2px; min-height: 32px; align-items: center; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .aff { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px 16px; min-height: 56px; }
  .foot { display: flex; justify-content: flex-end; gap: 10px; }
  .btn { padding: 7px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; font: inherit; cursor: pointer; }
  .btn:hover { background: var(--accent-soft); }
  .btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.prim:hover { filter: brightness(1.1); }
  .btn.big { padding: 10px 36px; font-size: 15px; }
  .btn.warn { border-color: var(--dot-orange); color: var(--dot-orange); }
  .errmsg { color: var(--bad-ink); background: var(--bad-bg); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .errmsg:empty { display: none; }
  /* Liste État avec pastilles */
  .combo { position: relative; }
  .combo-btn { display: flex; align-items: center; gap: 8px; min-width: 160px; font: inherit; font-size: 14px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); cursor: pointer; text-align: left; }
  .combo-btn .clabel { flex: 1; }
  .combo-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .combo-list { position: absolute; right: 0; top: calc(100% + 2px); min-width: 100%; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 3; max-height: 220px; overflow: auto; }
  .combo-list[hidden] { display: none; }
  .combo-list li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 14px; color: var(--ink); }
  .combo-list li:hover, .combo-list li.actif { background: var(--accent-soft); }
  .combo-list li[aria-selected="true"] { font-weight: 600; }
  .cdot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); flex: none; display: inline-block; }
  .coche svg { width: 16px; height: 16px; color: var(--green); vertical-align: middle; }
  th.ctr, td.ctr { text-align: center; }
  .card.wide { width: min(900px, 100%); }
  .card .wrap { flex: none; max-height: 60vh; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .msg { padding: 24px; color: var(--muted); }
  @media (max-width: 640px) { aside { width: 130px; } .search { width: 120px; } .bar { flex-wrap: wrap; gap: 8px; } }
</style>
</head>
<body>
<div class="msg">Chargement…</div>

<script>
  const TABLE_PRINCIPALE = "Manometres";
  const TABLE_PLAGES = "Plages_manometres";
  const COLONNE_PLAGE = "Plage";

  // Noms possibles des colonnes (comparés sans accents, majuscules, espaces ni "_")
  const ALIAS = {
    Reference: ["reference"],
    Plage:     ["plage"],
    Type:      ["type"],
    Cadran:    ["cadran"],
    Pmin:      ["pmin"],
    Pmax:      ["pmax"],
    Validite:  ["validite"],
    Etat:      ["etat"],
    Dispo:     ["dispo"],
    Certificat:["certificat"],
    Incertitude:["incertitude"],
    Alerte:    ["alerte"],
    OK:        ["ok"],
    Prispar:   ["prispar"],
    Affaire:   ["affaire"],
    Datepret:  ["datepret"],
    Commentaires: ["commentaires"],
    COFRAC:    ["cofrac"],
    Datecertificat: ["datecertificat"]
  };

  const CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5 12.5 20a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>';
  const cles = {};            // identifiants réels des colonnes
  let choixEtat = [];
  let ficheId = null;
  let rows = [];
  let plagesTable = [];
  let plageActive = null;     // null = toutes
  let recherche = "";
  let dispoSeulement = true;  // interrupteur actif par défaut
  let selectedId = null;
  let couleursEtat = {};      // { choix: {fillColor, textColor, fontBold, ...} }
  let nomsFichiers = {};      // { idPieceJointe: nom }
  let jeton = null;           // { baseUrl, token }
  let colEtatId = "Etat";

  grist.ready({ requiredAccess: "full" });

  grist.onRecords(function (records) {
    rows = records.map(normaliser);
    build();
    if (ficheId !== null) renderAffect();
  });
  grist.onRecord(r => { selectedId = r ? r.id : null; highlight(); });

  // ----- Données complémentaires (échecs tolérés) -----
  grist.docApi.fetchTable(TABLE_PLAGES).then(t => {
    plagesTable = (t[COLONNE_PLAGE] || []).map(txt).filter(Boolean);
    build();
  }).catch(() => {});

  chargerCouleursEtat();
  grist.docApi.fetchTable("_grist_Attachments").then(t => {
    (t.id || []).forEach((id, i) => { nomsFichiers[id] = t.fileName ? t.fileName[i] : ""; });
    renderTable();
  }).catch(() => {});
  rafraichirJeton();

  function chargerCouleursEtat() {
    Promise.all([
      grist.docApi.fetchTable("_grist_Tables"),
      grist.docApi.fetchTable("_grist_Tables_column")
    ]).then(([tables, cols]) => {
      const iT = (tables.tableId || []).indexOf(TABLE_PRINCIPALE);
      if (iT < 0) return;
      const tableRef = tables.id[iT];
      for (let i = 0; i < cols.id.length; i++) {
        if (cols.parentId[i] === tableRef && cle(cols.colId[i]) === "etat") {
          colEtatId = cols.colId[i];
          try {
            const opts = JSON.parse(cols.widgetOptions[i] || "{}");
            couleursEtat = opts.choiceOptions || {};
            choixEtat = opts.choices || [];
          } catch (e) {}
        }
      }
      renderTable();
    }).catch(() => {});
  }

  function rafraichirJeton() {
    grist.docApi.getAccessToken({ readOnly: true }).then(t => {
      jeton = t;
      renderTable();
      setTimeout(rafraichirJeton, Math.max(30000, (t.ttlMs || 300000) * 0.5));
    }).catch(() => {});
  }

  // ----- Utilitaires -----
  function cle(s) {
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }
  function normaliser(rec) {
    const index = {};
    Object.keys(rec).forEach(k => { index[cle(k)] = k; });
    const out = { id: rec.id };
    Object.keys(ALIAS).forEach(nom => {
      const trouve = ALIAS[nom].find(a => index[a] !== undefined);
      out[nom] = trouve ? rec[index[trouve]] : undefined;
      if (trouve) cles[nom] = index[trouve];
    });
    return out;
  }
  function txt(v) {
    if (v === null || v === undefined) return "";
    if (Array.isArray(v)) return v.join(", ");
    return String(v);
  }
  function plageMax(label) {
    const m = txt(label).match(/\/\s*([\d.,]+)/);
    return m ? parseFloat(m[1].replace(",", ".")) : Infinity;
  }
  function toDate(v) {
    if (v === null || v === undefined || v === "") return null;
    if (v instanceof Date) return v;
    if (typeof v === "number") return new Date(v * 1000);
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }
  function fmtDate(v) {
    const d = toDate(v);
    return d ? d.toLocaleDateString("fr-FR", { timeZone: "UTC" }) : txt(v);
  }
  function fmtNum(v) { return typeof v === "number" ? v.toLocaleString("fr-FR") : txt(v); }
  function esc(s) {
    return txt(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function estDispo(r) {
    const v = r.Dispo;
    return v === true || v === 1 || v === "true";
  }
  function idsPJ(v) {
    // Colonne Pièces jointes : ["L", id1, id2, ...]
    return Array.isArray(v) ? v.filter(x => typeof x === "number") : [];
  }

  // ----- Rendu -----
  function squelette() {
    document.body.innerHTML =
      '<aside><h2>Plage</h2><div id="liste"></div></aside>' +
      '<main><div class="bar"><h1 id="titre"></h1>' +
      '<input class="search" id="q" type="search" placeholder="Rechercher une référence" aria-label="Rechercher">' +
      '<label class="sw"><input type="checkbox" id="dispo" checked><span class="track"></span><span>Dispo uniquement</span></label><button class="btn" id="b-util" style="white-space:nowrap"></button></div>' +
      '<div class="wrap"><table><thead><tr>' +
      '<th class="mini" title="Alerte"' + '><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v5M12 17.5v.5"/></svg></th>' +
      "<th>Référence</th><th>Type</th><th>Cadran</th><th>P min / P max</th><th>Incertitude</th><th>Validité</th><th>État</th><th class='ctr'>Affecté</th>" +
      '<th class="mini" title="Certificat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5 12.5 20a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg></th>' +
      '</tr></thead><tbody id="corps"></tbody></table><div id="vide" class="empty" hidden>Aucun manomètre pour cette sélection.</div></div></main>' +
      '<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Certificat"><div class="v-box">' +
      '<div class="v-head"><span class="nom" id="v-nom"></span><a class="v-btn prim" id="v-dl" href="#">Télécharger</a><button class="v-btn" id="v-close">Fermer</button></div>' +
      '<div class="v-body" id="v-body"></div></div></div>';
    document.getElementById("v-close").addEventListener("click", fermerVisionneuse);
    document.getElementById("viewer").addEventListener("click", e => { if (e.target.id === "viewer") fermerVisionneuse(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") fermerHaut(); });
    ajouterDialogues();
    document.getElementById("q").addEventListener("input", e => { recherche = e.target.value.trim().toLowerCase(); build(); });
    document.getElementById("b-util").addEventListener("click", ouvrirUtilises);
    document.getElementById("dispo").addEventListener("change", e => { dispoSeulement = e.target.checked; build(); });
  }

  function build() {
    if (!document.getElementById("liste")) squelette();

    const base = rows.filter(r => !dispoSeulement || estDispo(r));
    const compte = {};
    base.forEach(r => { const p = txt(r.Plage); compte[p] = (compte[p] || 0) + 1; });
    const noms = Array.from(new Set(plagesTable.concat(rows.map(r => txt(r.Plage))))).filter(Boolean);
    noms.sort((a, b) => plageMax(a) - plageMax(b) || a.localeCompare(b, "fr"));
    if (plageActive !== null && !noms.includes(plageActive)) plageActive = null;

    const liste = document.getElementById("liste");
    const items = [{ nom: null, label: "Toutes", n: base.length }]
      .concat(noms.map(n => ({ nom: n, label: n, n: compte[n] || 0 })));
    liste.innerHTML = items.map((it, i) =>
      '<button class="plage' + (it.n === 0 ? " vide" : "") + '" data-i="' + i + '" aria-pressed="' + (it.nom === plageActive) + '">' +
      "<span>" + esc(it.label) + '</span><span class="n">' + it.n + "</span></button>").join("");
    liste.querySelectorAll(".plage").forEach(b => b.addEventListener("click", () => {
      plageActive = items[+b.dataset.i].nom;
      build();
    }));
    renderTable();
  }

  function tagEtat(etat) {
    if (!etat) return "";
    const o = couleursEtat[etat] || {};
    let style = "";
    if (o.fillColor) style += "background:" + o.fillColor + ";";
    if (o.textColor) style += "color:" + o.textColor + ";";
    if (o.fontBold) style += "font-weight:bold;";
    if (o.fontItalic) style += "font-style:italic;";
    if (o.fontUnderline) style += "text-decoration:underline;";
    if (o.fontStrikethrough) style += "text-decoration:line-through;";
    return '<span class="tag" style="' + style + '">' + esc(etat) + "</span>";
  }

  function liensPDF(r) {
    return idsPJ(r.Certificat).map(id => {
      const nom = nomsFichiers[id] || ("Pièce jointe " + id);
      return '<button class="clip" data-pj="' + id + '" title="' + esc(nom) + '" aria-label="Afficher ' + esc(nom) + '">' + CLIP + "</button>";
    }).join("");
  }

  function pastille(r) {
    if (r.OK === false) return '<span class="dot red" title="Non conforme (OK = faux)" role="img" aria-label="Non conforme"></span>';
    if (r.Alerte === true || r.Alerte === 1 || r.Alerte === "true") return '<span class="dot orange" title="Alerte" role="img" aria-label="Alerte"></span>';
    return "";
  }

  // ----- Visionneuse -----
  let urlBlob = null;
  function fermerVisionneuse() {
    const v = document.getElementById("viewer");
    if (!v || v.hidden) return;
    v.hidden = true;
    document.getElementById("v-body").innerHTML = "";
    if (urlBlob) { URL.revokeObjectURL(urlBlob); urlBlob = null; }
  }
  function ouvrirVisionneuse(id) {
    if (!jeton) return;
    const nom = nomsFichiers[id] || ("Pièce jointe " + id);
    const url = jeton.baseUrl + "/attachments/" + id + "/download?auth=" + encodeURIComponent(jeton.token);
    const dl = document.getElementById("v-dl");
    const corps = document.getElementById("v-body");
    document.getElementById("v-nom").textContent = nom;
    corps.innerHTML = '<div class="err">Chargement…</div>';
    document.getElementById("viewer").hidden = false;
    dl.href = url; dl.setAttribute("download", nom); dl.removeAttribute("target");
    fetch(url).then(res => {
      if (!res.ok) throw new Error(res.status);
      return res.blob();
    }).then(blob => {
      const pdf = new Blob([blob], { type: "application/pdf" });
      urlBlob = URL.createObjectURL(pdf);
      corps.innerHTML = '<iframe title="' + esc(nom) + '"></iframe>';
      corps.firstChild.src = urlBlob;
      dl.href = urlBlob;               // téléchargement depuis la visionneuse
    }).catch(() => {
      corps.innerHTML = '<div class="err">Aperçu indisponible dans ce contexte. Utilisez « Télécharger » pour ouvrir le fichier.</div>';
      dl.target = "_blank";
    });
  }

  function renderTable() {
    const corps = document.getElementById("corps");
    if (!corps) return;
    document.getElementById("b-util").textContent = "Manomètres utilisés (" + rows.filter(estUtilise).length + ")";
    document.getElementById("titre").textContent = plageActive === null ? "Tous les manomètres" : plageActive;
    const aujourdhui = new Date();
    const vus = rows.filter(r =>
      (!dispoSeulement || estDispo(r)) &&
      (plageActive === null || txt(r.Plage) === plageActive) &&
      (!recherche || txt(r.Reference).toLowerCase().includes(recherche))
    ).sort((a, b) => txt(a.Reference).localeCompare(txt(b.Reference), "fr", { numeric: true }));

    corps.innerHTML = vus.map(r => {
      const d = toDate(r.Validite);
      const perime = d && d < aujourdhui;
      return '<tr data-id="' + r.id + '"' + (r.id === selectedId ? ' class="sel"' : "") + ">" +
        '<td class="mini">' + pastille(r) + "</td>" +
        '<td class="ref">' + esc(r.Reference) + "</td>" +
        "<td>" + esc(r.Type) + "</td>" +
        "<td>" + esc(r.Cadran) + "</td>" +
        '<td class="num">' + esc(fmtNum(r.Pmin)) + " / " + esc(fmtNum(r.Pmax)) + "</td>" +
        '<td class="num">' + esc(fmtNum(r.Incertitude)) + "</td>" +
        '<td><span class="tag' + (perime ? " bad" : "") + '">' + esc(fmtDate(r.Validite)) + "</span></td>" +
        "<td>" + tagEtat(txt(r.Etat)) + "</td>" +
        '<td class="ctr">' + (estUtilise(r) ? COCHE : "") + "</td>" +
        '<td class="mini">' + liensPDF(r) + "</td></tr>";
    }).join("");
    document.getElementById("vide").hidden = vus.length > 0;
    if (visible("dlg-util")) renderUtilises();

    corps.querySelectorAll("tr").forEach(tr => {
      tr.addEventListener("click", () => grist.setCursorPos({ rowId: +tr.dataset.id }));
      tr.addEventListener("dblclick", () => ouvrirFiche(+tr.dataset.id));
    });
    corps.querySelectorAll(".clip").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      ouvrirVisionneuse(+b.dataset.pj);
    }));
  }

  // ----- Fiche détail -----
  function ajouterDialogues() {
    document.body.insertAdjacentHTML("beforeend",
      '<div class="dlg" id="dlg-fiche" hidden></div>' +
      '<div class="dlg z6" id="dlg-aff" hidden></div>' +
      '<div class="dlg z7" id="dlg-conf" hidden></div>' +
      '<div class="dlg" id="dlg-util" hidden></div>');
  }
  function ligne(id) { return rows.find(r => r.id === id); }
  function visible(id) { const e = document.getElementById(id); return e && !e.hidden; }
  function fermerHaut() {
    if (visible("viewer")) fermerVisionneuse();
    else if (visible("dlg-conf")) document.getElementById("dlg-conf").hidden = true;
    else if (visible("dlg-aff")) document.getElementById("dlg-aff").hidden = true;
    else if (visible("dlg-fiche")) fermerFiche();
    else if (visible("dlg-util")) document.getElementById("dlg-util").hidden = true;
  }
  function fermerFiche() {
    ficheId = null;
    const f = document.getElementById("dlg-fiche");
    f.hidden = true; f.innerHTML = "";
  }
  function estUtilise(r) { return (r.OK === true || r.OK === 1) && !estDispo(r); }
  const COCHE = '<span class="coche" role="img" aria-label="Affecté" title="Affecté"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5L20 7"/></svg></span>';
  function estPris(r) { return txt(r.Prispar).trim() !== "" || txt(r.Affaire).trim() !== ""; }
  function champ(label, val, cls) {
    return '<label class="fld"><span>' + label + '</span><input readonly value="' + esc(val) + '"' + (cls ? ' class="' + cls + '"' : "") + "></label>";
  }
  function aujourdhuiISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function ecrire(id, patch) {
    const fields = {};
    Object.keys(patch).forEach(n => { if (cles[n]) fields[cles[n]] = patch[n]; });
    return grist.getTable().update({ id: id, fields: fields }).then(() => {
      const r = ligne(id);
      if (r) Object.assign(r, patch);
    });
  }
  function ouvrirFiche(id) {
    const r = ligne(id);
    if (!r) return;
    ficheId = id;
    const d = toDate(r.Validite);
    const perime = d && d < new Date();
    const etat = txt(r.Etat);
    const choix = Array.from(new Set(choixEtat.concat(Object.keys(couleursEtat), rows.map(x => txt(x.Etat))))).filter(Boolean);
    if (etat && !choix.includes(etat)) choix.push(etat);
    
    const f = document.getElementById("dlg-fiche");
    f.innerHTML =
      '<div class="card" role="dialog" aria-modal="true" aria-label="Fiche du manomètre">' +
      '<div class="f-head"><h2>' + esc(r.Reference) + "</h2>" +
      '<div class="fld edit"><span>État</span><div class="combo" id="f-combo"><button type="button" class="combo-btn" id="f-etat" aria-haspopup="listbox" aria-expanded="false"></button><ul class="combo-list" id="f-etat-list" role="listbox" hidden></ul></div></div></div>' +
      '<div class="row">' + champ("Type", r.Type) + champ("Cadran", r.Cadran) + "</div>" +
      '<div class="row">' + champ("Plage", r.Plage) + champ("Incertitude", fmtNum(r.Incertitude)) + champ("COFRAC", r.COFRAC) + "</div>" +
      '<hr class="sep">' +
      '<div class="row">' + champ("Date du certificat", fmtDate(r.Datecertificat)) + champ("Validité", fmtDate(r.Validite), perime ? "bad" : "") +
      '<div class="fld"><span>Certificat</span><div class="clips" id="f-clips">' + liensPDF(r) + "</div></div></div>" +
      '<hr class="sep">' +
      '<div class="aff" id="f-aff"></div>' +
      '<hr class="sep">' +
      '<label class="fld edit"><span>Commentaires</span><textarea id="f-com">' + esc(r.Commentaires) + "</textarea></label>" +
      '<div id="f-err" class="errmsg"></div>' +
      '<div class="foot"><button class="btn" id="f-annuler">Annuler</button><button class="btn prim" id="f-ok">OK</button></div></div>';
    f.hidden = false;

    const sel = initCombo(choix, etat);
    f.querySelectorAll(".clip").forEach(b => b.addEventListener("click", () => ouvrirVisionneuse(+b.dataset.pj)));
    document.getElementById("f-annuler").addEventListener("click", fermerFiche);
    document.getElementById("f-ok").addEventListener("click", () => {
      const cur = ligne(id) || r;
      const patch = {};
      if (sel.value !== txt(cur.Etat)) patch.Etat = sel.value;
      const com = document.getElementById("f-com").value;
      if (com !== txt(cur.Commentaires)) patch.Commentaires = com;
      if (!Object.keys(patch).length) { fermerFiche(); return; }
      ecrire(id, patch).then(fermerFiche).catch(e => {
        document.getElementById("f-err").textContent = "Enregistrement impossible : " + (e && e.message ? e.message : e);
      });
    });
    renderAffect();
    sel.focus();
  }

  function renderAffect() {
    const z = document.getElementById("f-aff");
    const r = ligne(ficheId);
    if (!z || !r) return;
    if (estPris(r)) {
      z.innerHTML = champ("Utilisateur", r.Prispar) + champ("Affaire", r.Affaire) + champ("Date de prêt", fmtDate(r.Datepret)) +
        '<button class="btn warn" id="f-retour">Retour</button>';
      document.getElementById("f-retour").addEventListener("click", () => {
        confirmer("Confirmer le retour du manomètre ? L'utilisateur, l'affaire et la date de prêt seront effacés.", () => {
          ecrire(ficheId, { Prispar: "", Affaire: "", Datepret: null }).then(renderAffect).catch(e => {
            document.getElementById("f-err").textContent = "Retour impossible : " + (e && e.message ? e.message : e);
          });
        });
      });
    } else {
      z.innerHTML = '<button class="btn prim big" id="f-affecter">Affecter</button>';
      document.getElementById("f-affecter").addEventListener("click", ouvrirAffecter);
    }
  }

  function confirmer(message, onYes) {
    const c = document.getElementById("dlg-conf");
    c.innerHTML = '<div class="card small" role="alertdialog" aria-modal="true"><div>' + esc(message) + "</div>" +
      '<div class="foot"><button class="btn" id="c-non">Annuler</button><button class="btn prim" id="c-oui">Confirmer</button></div></div>';
    c.hidden = false;
    document.getElementById("c-non").addEventListener("click", () => { c.hidden = true; });
    document.getElementById("c-oui").addEventListener("click", () => { c.hidden = true; onYes(); });
    document.getElementById("c-oui").focus();
  }

  function ouvrirAffecter() {
    const a = document.getElementById("dlg-aff");
    a.innerHTML = '<div class="card small" role="dialog" aria-modal="true" aria-label="Affecter le manomètre"><h2>Affecter</h2>' +
      '<label class="fld edit"><span>Utilisateur</span><input id="a-user" type="text"></label>' +
      '<label class="fld edit"><span>Affaire</span><input id="a-aff" type="text"></label>' +
      '<label class="fld edit"><span>Date de prêt</span><input id="a-date" type="date" value="' + aujourdhuiISO() + '"></label>' +
      '<div id="a-err" class="errmsg"></div>' +
      '<div class="foot"><button class="btn" id="a-annuler">Annuler</button><button class="btn prim" id="a-ok">OK</button></div></div>';
    a.hidden = false;
    document.getElementById("a-user").focus();
    document.getElementById("a-annuler").addEventListener("click", () => { a.hidden = true; });
    document.getElementById("a-ok").addEventListener("click", () => {
      const user = document.getElementById("a-user").value.trim();
      const aff = document.getElementById("a-aff").value.trim();
      const dv = document.getElementById("a-date").value;
      const err = document.getElementById("a-err");
      if (!user && !aff) { err.textContent = "Renseignez au moins l'utilisateur ou l'affaire."; return; }
      let ts = null;
      if (dv) { const p = dv.split("-").map(Number); ts = Date.UTC(p[0], p[1] - 1, p[2]) / 1000; }
      ecrire(ficheId, { Prispar: user, Affaire: aff, Datepret: ts }).then(() => {
        a.hidden = true;
        renderAffect();
      }).catch(e => { err.textContent = "Enregistrement impossible : " + (e && e.message ? e.message : e); });
    });
  }

  function pastilleEtat(c) {
    const o = couleursEtat[c] || {};
    return '<span class="cdot" style="background:' + (o.fillColor || "transparent") + '"></span>';
  }
  function initCombo(choix, courant) {
    let valeur = courant;
    const wrap = document.getElementById("f-combo");
    const btn = document.getElementById("f-etat");
    const list = document.getElementById("f-etat-list");
    const vals = [""].concat(choix);
    list.innerHTML = vals.map((c, i) =>
      '<li role="option" data-i="' + i + '">' + pastilleEtat(c) + "<span>" + (c ? esc(c) : "&nbsp;") + "</span></li>").join("");
    let actif = Math.max(0, vals.indexOf(valeur));
    function maj() {
      btn.innerHTML = pastilleEtat(valeur) + '<span class="clabel">' + (valeur ? esc(valeur) : "&nbsp;") + '</span><span aria-hidden="true">&#9662;</span>';
      list.querySelectorAll("li").forEach((li, i) => {
        li.setAttribute("aria-selected", String(vals[i] === valeur));
        li.classList.toggle("actif", i === actif);
      });
    }
    function ouvrir() { list.hidden = false; btn.setAttribute("aria-expanded", "true"); maj(); }
    function fermer() { list.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    function choisir(i) { valeur = vals[i]; actif = i; fermer(); maj(); btn.focus(); }
    btn.addEventListener("click", () => (list.hidden ? ouvrir() : fermer()));
    list.addEventListener("click", e => {
      const li = e.target.closest("li");
      if (li) choisir(+li.dataset.i);
    });
    wrap.addEventListener("keydown", e => {
      if (e.key === "Escape" && !list.hidden) { e.stopPropagation(); fermer(); btn.focus(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (list.hidden) { ouvrir(); return; }
        actif = Math.min(vals.length - 1, Math.max(0, actif + (e.key === "ArrowDown" ? 1 : -1)));
        maj();
      } else if ((e.key === "Enter" || e.key === " ") && !list.hidden) {
        e.preventDefault();
        choisir(actif);
      }
    });
    document.getElementById("dlg-fiche").onclick = e => { if (!wrap.contains(e.target)) fermer(); };
    maj();
    return { get value() { return valeur; }, focus() { btn.focus(); } };
  }

  // ----- Fenêtre « Manomètres utilisés » -----
  function ouvrirUtilises() {
    const u = document.getElementById("dlg-util");
    u.innerHTML = '<div class="card wide" role="dialog" aria-modal="true" aria-label="Manomètres utilisés">' +
      '<div class="f-head"><h2>Manomètres utilisés</h2><button class="btn" id="u-fermer">Fermer</button></div>' +
      '<div class="wrap"><table><thead><tr><th>Plage</th><th>Référence</th><th>Pris par</th><th>Affaire</th><th>Date de prêt</th>' +
      '<th class="mini" title="Certificat">' + CLIP + '</th></tr></thead><tbody id="u-corps"></tbody></table>' +
      '<div id="u-vide" class="empty" hidden>Aucun manomètre utilisé.</div></div></div>';
    u.hidden = false;
    document.getElementById("u-fermer").addEventListener("click", () => { u.hidden = true; });
    renderUtilises();
    document.getElementById("u-fermer").focus();
  }
  function renderUtilises() {
    const c = document.getElementById("u-corps");
    if (!c) return;
    const liste = rows.filter(estUtilise).sort((a, b) =>
      plageMax(a.Plage) - plageMax(b.Plage) ||
      txt(a.Reference).localeCompare(txt(b.Reference), "fr", { numeric: true }));
    c.innerHTML = liste.map(r =>
      "<tr><td>" + esc(r.Plage) + '</td><td class="ref">' + esc(r.Reference) + "</td><td>" + esc(r.Prispar) + "</td><td>" +
      esc(r.Affaire) + "</td><td>" + esc(fmtDate(r.Datepret)) + '</td><td class="mini">' + liensPDF(r) + "</td></tr>").join("");
    document.getElementById("u-vide").hidden = liste.length > 0;
    c.querySelectorAll(".clip").forEach(b => b.addEventListener("click", () => ouvrirVisionneuse(+b.dataset.pj)));
  }

  function highlight() {
    document.querySelectorAll("#corps tr").forEach(tr =>
      tr.classList.toggle("sel", +tr.dataset.id === selectedId));
  }
</script>
</body>
</html>
