<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manomètres</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #1c2833;
    --muted: #66788a;
    --line: #dbe2e8;
    --accent: #0b6e8a;
    --accent-soft: #dff1f6;
    --ok-bg: #d8f3dc; --ok-ink: #1b5e2b;
    --warn-bg: #fdebc8; --warn-ink: #7a4b00;
    --bad-bg: #fcd5d5; --bad-ink: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b21; --panel: #1d252d; --ink: #e6ecf1; --muted: #8fa1b2;
      --line: #2f3b46; --accent: #4cc3e0; --accent-soft: #1d3a45;
      --ok-bg: #1d3b26; --ok-ink: #9be3ab;
      --warn-bg: #46361a; --warn-ink: #f3cd85;
      --bad-bg: #4a2323; --bad-ink: #f5a6a6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; min-height: 0;
  }
  aside {
    width: 190px; flex: none; padding: 14px 10px;
    border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto;
  }
  aside h2 { font-size: 15px; margin: 0 6px 10px; text-decoration: underline; text-underline-offset: 4px; }
  .plage {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 8px 12px; margin-bottom: 4px;
    border: 1.5px solid transparent; border-radius: 999px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .plage:hover { background: var(--accent-soft); }
  .plage[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .plage:focus-visible, .search:focus-visible, .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .plage .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .plage.vide { color: var(--muted); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 16px; margin: 0; flex: 1; }
  .search {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: inherit; font: inherit; width: 200px;
  }
  .wrap { flex: 1; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); border-bottom: 2px solid var(--line); font-weight: 600; z-index: 1; }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--accent-soft); }
  tr.sel { background: var(--accent-soft); }
  td.ref { font-weight: 600; font-variant-numeric: tabular-nums; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; background: var(--line); }
  .tag.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .go { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px 6px; border-radius: 4px; }
  .go:hover { color: var(--accent); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .msg { padding: 24px; color: var(--muted); }
  @media (max-width: 560px) { aside { width: 130px; } .search { width: 120px; } }
</style>
</head>
<body>
<div class="msg" id="msg">Chargement…</div>

<script>
  // Colonnes à associer dans le panneau de configuration Grist
  const COLONNES = [
    { name: "Reference", title: "Référence", type: "Any" },
    { name: "Plage",     title: "Plage",     type: "Any" },
    { name: "Type",      title: "Type",      type: "Any", optional: true },
    { name: "Cadran",    title: "Cadran",    type: "Any", optional: true },
    { name: "Pmin",      title: "P min",     type: "Any", optional: true },
    { name: "Pmax",      title: "P max",     type: "Any", optional: true },
    { name: "Validite",  title: "Validité",  type: "Any", optional: true },
    { name: "Etat",      title: "État",      type: "Any", optional: true }
  ];
  const TABLE_PLAGES = "Plages_manometres";   // ID de la table des plages
  const COLONNE_PLAGE = "Plage";               // colonne affichée dans cette table

  let rows = [];
  let plagesTable = [];      // plages issues de la table Plages_manometres
  let plageActive = null;    // null = toutes
  let recherche = "";
  let selectedId = null;

  grist.ready({ requiredAccess: "full", columns: COLONNES });

  grist.onRecords(function (records, mappings) {
    if (!mappings) { show("Associez les colonnes dans le panneau de configuration du widget."); return; }
    rows = records.map(r => {
      const m = grist.mapColumnNames(r);
      return m ? Object.assign(m, { id: r.id }) : null;
    }).filter(Boolean);
    build();
  });

  grist.onRecord(r => { selectedId = r ? r.id : null; highlight(); });

  // Charge la liste complète des plages (même celles sans manomètre)
  grist.docApi.fetchTable(TABLE_PLAGES).then(t => {
    plagesTable = (t[COLONNE_PLAGE] || []).map(txt).filter(Boolean);
    build();
  }).catch(() => { /* on se rabat sur les plages présentes dans les données */ });

  // ---------- utilitaires ----------
  function txt(v) {
    if (v === null || v === undefined) return "";
    if (Array.isArray(v)) return v.join(", ");
    return String(v);
  }
  function plageMax(label) {
    const m = txt(label).match(/\/\s*([\d.,]+)/);
    return m ? parseFloat(m[1].replace(",", ".")) : Infinity;
  }
  function toDate(v) {
    if (v === null || v === undefined || v === "") return null;
    if (v instanceof Date) return v;
    if (typeof v === "number") return new Date(v * 1000);
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }
  function fmtDate(v) {
    const d = toDate(v);
    return d ? d.toLocaleDateString("fr-FR", { timeZone: "UTC" }) : txt(v);
  }
  function fmtNum(v) {
    return typeof v === "number" ? v.toLocaleString("fr-FR") : txt(v);
  }
  function esc(s) {
    return txt(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function show(message) {
    document.body.innerHTML = '<div class="msg">' + esc(message) + "</div>";
  }

  // ---------- rendu ----------
  function build() {
    const compte = {};
    rows.forEach(r => { const p = txt(r.Plage); compte[p] = (compte[p] || 0) + 1; });
    const noms = Array.from(new Set(plagesTable.concat(Object.keys(compte)))).filter(Boolean);
    noms.sort((a, b) => plageMax(a) - plageMax(b) || a.localeCompare(b, "fr"));
    if (plageActive !== null && !noms.includes(plageActive)) plageActive = null;

    if (!document.getElementById("liste")) {
      document.body.innerHTML =
        '<aside><h2>Plage</h2><div id="liste"></div></aside>' +
        '<main><div class="bar"><h1 id="titre"></h1>' +
        '<input class="search" id="q" type="search" placeholder="Rechercher une référence" aria-label="Rechercher"></div>' +
        '<div class="wrap"><table><thead><tr>' +
        "<th>Référence</th><th>Type</th><th>Cadran</th><th>P min / P max</th><th>Validité</th><th>État</th><th></th>" +
        '</tr></thead><tbody id="corps"></tbody></table><div id="vide" class="empty" hidden>Aucun manomètre pour cette sélection.</div></div></main>';
      document.getElementById("q").addEventListener("input", e => { recherche = e.target.value.trim().toLowerCase(); renderTable(); });
    }

    const liste = document.getElementById("liste");
    const items = [{ nom: null, label: "Toutes", n: rows.length }]
      .concat(noms.map(n => ({ nom: n, label: n, n: compte[n] || 0 })));
    liste.innerHTML = items.map((it, i) =>
      '<button class="plage' + (it.n === 0 ? " vide" : "") + '" data-i="' + i + '" aria-pressed="' + (it.nom === plageActive) + '">' +
      "<span>" + esc(it.label) + '</span><span class="n">' + it.n + "</span></button>").join("");
    liste.querySelectorAll(".plage").forEach(b => b.addEventListener("click", () => {
      plageActive = items[+b.dataset.i].nom;
      build();
    }));
    renderTable();
  }

  function etatClasse(e) {
    const s = txt(e).toLowerCase();
    if (s.startsWith("neuf") || s === "bon") return "ok";
    if (s.startsWith("mauvais") || s === "hs") return "bad";
    return "";
  }

  function renderTable() {
    document.getElementById("titre").textContent = plageActive === null ? "Tous les manomètres" : plageActive;
    const aujourdhui = new Date();
    const vus = rows.filter(r =>
      (plageActive === null || txt(r.Plage) === plageActive) &&
      (!recherche || txt(r.Reference).toLowerCase().includes(recherche))
    ).sort((a, b) => txt(a.Reference).localeCompare(txt(b.Reference), "fr", { numeric: true }));

    document.getElementById("corps").innerHTML = vus.map(r => {
      const d = toDate(r.Validite);
      const perime = d && d < aujourdhui;
      const etat = txt(r.Etat);
      return '<tr data-id="' + r.id + '"' + (r.id === selectedId ? ' class="sel"' : "") + ">" +
        '<td class="ref">' + esc(r.Reference) + "</td>" +
        "<td>" + esc(r.Type) + "</td>" +
        "<td>" + esc(r.Cadran) + "</td>" +
        '<td class="num">' + esc(fmtNum(r.Pmin)) + " / " + esc(fmtNum(r.Pmax)) + "</td>" +
        '<td><span class="tag ' + (perime ? "bad" : "") + '">' + esc(fmtDate(r.Validite)) + "</span></td>" +
        "<td>" + (etat ? '<span class="tag ' + etatClasse(etat) + '">' + esc(etat) + "</span>" : "") + "</td>" +
        '<td><button class="go" title="Ouvrir la fiche" aria-label="Ouvrir la fiche">&#9993;</button></td></tr>';
    }).join("");
    document.getElementById("vide").hidden = vus.length > 0;

    document.querySelectorAll("#corps tr").forEach(tr => {
      const id = +tr.dataset.id;
      tr.addEventListener("click", () => grist.setCursorPos({ rowId: id }));
      tr.querySelector(".go").addEventListener("click", e => {
        e.stopPropagation();
        grist.setCursorPos({ rowId: id });
      });
    });
  }

  function highlight() {
    document.querySelectorAll("#corps tr").forEach(tr =>
      tr.classList.toggle("sel", +tr.dataset.id === selectedId));
  }
</script>
</body>
</html>
