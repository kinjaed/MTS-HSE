<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matériel</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1f2933;--mut:#6b7785;--bd:#d9dee4;--ac:#2563eb;--ok:#16a34a;--sel:#e0ebff;--pb:#e3eefc}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1f24;--card:#252b32;--tx:#e6e9ec;--mut:#9aa5b1;--bd:#3a424b;--ac:#3b82f6;--ok:#34c768;--sel:#1e3358;--pb:#1d2b44}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:8px;gap:8px}
  .bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
  .bar b{font-size:12px;letter-spacing:.05em;color:var(--mut)}
  /* Catégories : défilant + curseur glissant bleu */
  .pills{position:relative;display:flex;flex-wrap:wrap;flex:1 1 280px;min-width:0;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:3px}
  .slider{position:absolute;top:0;left:0;width:0;height:0;border-radius:16px;background:var(--ac);transition:transform .25s ease,width .25s ease,opacity .2s;z-index:0;pointer-events:none}
  .pill{position:relative;z-index:1;flex:0 0 auto;border:0;background:none;color:var(--tx);padding:4px 12px;border-radius:16px;cursor:pointer;font:inherit;white-space:nowrap;transition:color .25s}
  .pill.on{color:#fff}
  /* Recherche */
  .search{width:200px;border:1px solid #b7dfc0;background:#e8f6ec;color:#1f2933;border-radius:16px;padding:5px 12px;font:inherit;outline:none}
  .search:focus{border-color:#6fbf85;box-shadow:0 0 0 2px #cdeed6}
  .search::placeholder{color:#6b8f74}
  .sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;white-space:nowrap}
  .sw input{display:none}
  .sw i{width:34px;height:18px;border-radius:9px;background:var(--bd);position:relative;transition:.15s}
  .sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked+i{background:var(--ac)}
  .sw.warn input:checked+i{background:#f97316}
  .sw.red input:checked+i{background:#dc2626}
  .sw input:checked+i::after{left:18px}
  /* Disposition : gauche réduit de moitié, droite réduite de moitié */
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(150px,.55fr) minmax(300px,2fr) minmax(120px,.4fr);gap:8px}
  .panel{background:var(--card);border:2px solid var(--bd);border-radius:6px;overflow:auto;min-height:0}
  table{border-collapse:collapse;width:100%}
  #left{table-layout:fixed}
  #left th.n{width:50px}
  #left td:first-child{overflow:hidden;text-overflow:ellipsis}
  th{position:sticky;top:0;background:var(--pb);text-align:left;font-size:11px;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;z-index:2}
  td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
  td.n,th.n{text-align:center}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--bg)}
  tr.sel{background:var(--sel)!important}
  tr.free td{font-weight:700}
  .ok{color:var(--ok);font-weight:700}
  .zero{color:var(--mut)}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:1px solid rgba(0,0,0,.25)}
  th.warn{font-size:14px;color:#d97706}
  .badge{display:inline-block;padding:1px 8px;border-radius:3px;font-weight:600;background:#e8e8e8;color:#222}
  .side{padding:10px;display:flex;flex-direction:column;gap:10px}
  .side label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
  .side div.v{border:1px solid var(--bd);border-radius:4px;padding:5px 8px;min-height:27px;background:var(--bg);overflow-wrap:anywhere}
  .uc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .uc h4{margin:0 0 6px;font-size:13px}
  .uc .lst3{display:flex;gap:6px}
  .uc .btnc{display:flex;flex-direction:column;gap:6px}
  .uc .btnc button{width:30px;height:30px;padding:0;font-weight:700;font-size:17px;line-height:1}
  .uc .tbl{flex:1;min-width:0;height:320px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:4px}
  .uc input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--ac)}
  @media (max-width:640px){.uc{grid-template-columns:1fr}}
  .cp.up .lst{top:auto;bottom:100%;margin:0 0 2px}
  .actions button.gold{background:#f2b705;border-color:#f2b705;color:#1f2933}
  .actions button.gold:hover{background:#d9a404;border-color:#d9a404}
  .sheet{background:#fff;color:#111;border:1px solid var(--bd);border-radius:4px;padding:16px}
  .dlg .sheet input.ptitle{width:100%;font-size:18px;font-weight:700;border:1px dashed #bbb;border-radius:4px;background:transparent;color:#111;padding:4px 6px;margin-bottom:4px}
  .sheet .pcount{font-size:11px;color:#555;margin-bottom:8px}
  .sheet table{font-size:12px}
  .sheet th{position:static;background:#e3eefc;color:#111;border-bottom:1px solid #999}
  .sheet td{border-bottom:1px solid #ccc;color:#111}
  .sheet tr.free td{font-weight:700}
  .sheet thead{display:table-header-group}
  .sheet tr{page-break-inside:avoid}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{height:auto!important;overflow:visible!important;background:#fff!important;padding:0!important}
    body>*{display:none!important}
    body>#modal5{display:block!important;position:static!important;background:none!important;padding:0!important}
    #modal5 .noprint{display:none!important}
    #dlg5{width:100%!important;max-height:none!important;overflow:visible!important;border:0!important;box-shadow:none!important;background:#fff!important;padding:0!important}
    .sheet{border:0;padding:0}
    .dlg .sheet input.ptitle{border:0;padding:0}
  }
  .rightcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  .rightcol .side{flex:1 1 auto;min-height:0}
  .actions{flex:none;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:visible}
  .actions button{width:100%;padding:8px 10px;background:var(--ac);border:1px solid var(--ac);color:#fff;font:inherit;font-weight:600;border-radius:5px;cursor:pointer}
  .actions button:hover{background:#1d4ed8;border-color:#1d4ed8}
  .side .bottom{margin-top:auto}
  .side .bottom hr{margin:0 0 16px}
  .side .okb{width:100%;padding:8px 10px;background:#16a34a;border:1px solid #16a34a;color:#fff;font:inherit;font-weight:600;border-radius:5px;cursor:pointer}
  .side .okb:hover{background:#15803d}
  .pcrow{display:flex;gap:6px}
  .pcrow>div:first-child{flex:1;min-width:0}
  .pcrow>div:last-child{width:68px;flex:none}
  .side input.ro{width:100%;border:1px solid var(--bd);border-radius:4px;padding:5px 8px;background:var(--bg);color:var(--tx);font:inherit;min-height:27px}
  .side .del,.dlg button.danger{background:#dc2626;border:1px solid #dc2626;color:#fff;font:inherit;font-weight:600;border-radius:5px;cursor:pointer}
  .side .del{width:100%;padding:8px 10px}
  .side .del:hover,.dlg button.danger:hover{background:#b91c1c}
  .dlg button.danger{padding:6px 16px}
  .side hr{border:0;border-top:1px solid var(--bd);width:100%;margin:2px 0}
  .empty{padding:16px;color:var(--mut);text-align:center;white-space:normal}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:8px}
  .modal.open{display:flex}
  .dlg{background:var(--pb);border:1px solid var(--bd);border-radius:8px;width:min(440px,100%);max-height:100%;overflow:auto;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .dlg h3{margin:0 0 12px;font-size:15px}
  .dlg .f{margin-bottom:10px}
  .dlg .f label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
  .dlg input[type=text],.dlg input[type=number],.dlg input[type=date],.dlg select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--tx);font:inherit}
  .dlg input:focus,.dlg select:focus{outline:2px solid var(--ac);outline-offset:-1px}
  .dlg input:disabled,.dlg select:disabled{opacity:.6}
  .dlg .ro{font-weight:700;border:1px solid var(--bd);border-radius:4px;padding:6px 8px;background:var(--bg);min-height:30px}
  .cp{position:relative}
  .cp .cur{width:100%;text-align:left;min-height:32px;padding:4px 8px}
  .cp .lst{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:4px;max-height:180px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.25);margin-top:2px}
  .cp.open .lst{display:block}
  .cp .opt{padding:5px 8px;cursor:pointer}
  .cp .opt:hover{background:var(--bg)}
  .cp[data-dis="1"] .cur{opacity:.6;pointer-events:none}
  .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
  .hd h3{margin:0}
  .wn{font-weight:700;margin:-6px 0 12px}
  .dlg .pen{padding:2px 8px;font-size:15px;line-height:1.2;border-radius:6px}
  .dlg .pen.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .dlg .row2{display:flex;gap:8px}
  .dlg .row2 .f{flex:1;min-width:0}
  .edit-row{display:none;gap:6px}
  .aff-on .edit-row{display:flex}
  .aff-on .ro-u,.aff-on .ro-c{display:none}
  .edit-row select{flex:1;min-width:0;font-weight:700}
  .dlg .plus{padding:4px 12px;font-weight:700}
  .aff{display:flex;gap:8px;margin-top:4px}
  .affok-btn,.affdate{display:none}
  .dlg .aff input.affdate{width:auto}
  .aff-on .affok-btn,.aff-on .affdate{display:inline-block}
  .aff .row2{display:flex;gap:8px;margin-top:10px}
  .aff .row2 .f{flex:1;margin:0}
  .ret{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
  .ret .f{flex:1;margin:0}
  .dlg hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
  .dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .dlg button{padding:6px 16px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
  .dlg button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  .dlg .err{color:#dc2626;margin-top:8px;font-size:12px}
  @media (max-width:800px){.main{grid-template-columns:1fr;overflow:auto}}
</style>
</head>
<body>
<div class="bar">
  <b>CATÉGORIE</b>
  <div class="pills" id="pills"><div class="slider" id="slider"></div></div>
  <input class="search" id="q" type="search" placeholder="Rechercher…">
  <label class="sw"><input type="checkbox" id="dispo"><i></i>Dispo uniquement</label>
  <label class="sw warn"><input type="checkbox" id="fech"><i></i>Échéance à venir</label>
  <label class="sw red"><input type="checkbox" id="fexp"><i></i>Expiré</label>
</div>
<div class="main">
  <div class="panel"><table id="left"><thead><tr><th>Désignation</th><th class="n">Total</th><th class="n">Dispo</th></tr></thead><tbody id="types"></tbody></table></div>
  <div class="panel"><table><thead><tr><th class="n warn" title="Prochain contrôle">⚠</th><th>N°</th><th>Marque</th><th>N° série</th><th>État</th><th>Utilisateur</th><th>Chantier</th></tr></thead><tbody id="mats"></tbody></table></div>
  <div class="rightcol">
    <div class="panel side" id="side"></div>
    <div class="panel actions">
      <button type="button" id="btnUC">Utilisateurs &amp; Chantiers</button>
      <button type="button" id="btnAdd">Ajouter un matériel</button>
      <button type="button" id="btnPrint" class="gold">Imprimer...</button>
    </div>
  </div>
</div>

<div class="modal" id="modal5" style="z-index:12"><div class="dlg" id="dlg5" style="width:min(1000px,100%)"></div></div>
<div class="modal" id="modal4" style="z-index:12"><div class="dlg" id="dlg4" style="width:min(440px,100%)"></div></div>
<div class="modal" id="modal3" style="z-index:12"><div class="dlg" id="dlg3" style="width:min(780px,100%)"></div></div>
<div class="modal" id="modal2" style="z-index:20"><div class="dlg" id="dlg2" style="width:min(340px,100%);overflow:visible"></div></div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>

<script>
// ---- Détection tolérante des noms de colonnes ----
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const M = {
  des:/^de?signation$/, cat:/^cate?gorie$/, num:/^n$/, marque:/^marque$/, serie:/^nse?rie$/, etat:/^e?tat$/,
  user:/^utilisateur$/, chantier:/^chantier$/, libre:/^libre$/, mes:/^miseenservice$/,
  dc:/^derniercontr?o?le$/, pc:/^prochaincontr?o?le$/, dmd:/^date(de)?miseadispo$/, dr:/^dateretour$/, du:/^dernierutil$/, ac:/^acontr?o?ler$/, ex:/^expire?$/
};
const T = { des:/^de?signation$/, cat:/^cate?gorie$/, catTxt:/^cat.*(txt|text|nom)$/, total:/^enservice$/, dispo:/^dispo$/ };
const pick = (keys, re) => keys.find(k => re.test(norm(k)));
const mapCols = (keys, defs) => Object.fromEntries(Object.entries(defs).map(([n,re]) => [n, pick(keys, re)]));
const rows = t => { const ks = Object.keys(t); return (t.id||[]).map((_,i)=>Object.fromEntries(ks.map(k=>[k,t[k][i]]))); };

let state = { mats:[], types:[], cat:'TOUS', type:null, mat:null, dispoOnly:false, q:'', etatColors:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const truthy = v => v === true || v === 'true' || v === 1;
const coll = new Intl.Collator('fr', {numeric:true, sensitivity:'base'});
const sameType = (m,t) => (m.desId != null && m.desId === t.id) || (m.des && norm(m.des) === norm(t.des));

// Métadonnées des colonnes (type, choix, couleurs, formule)
async function loadMeta() {
  try {
    const tid = await grist.selectedTable.getTableId();
    const tabs = rows(await grist.docApi.fetchTable('_grist_Tables'));
    const ref = (tabs.find(t => t.tableId === tid) || {}).id;
    const out = {};
    state.tableRef = ref;
    state.tableIds = tabs.map(t => t.tableId);
    state.metaCols = rows(await grist.docApi.fetchTable('_grist_Tables_column'));
    state.metaCols.filter(c => c.parentId === ref).forEach(c => {
      let wo = {}; try { wo = JSON.parse(c.widgetOptions || '{}'); } catch(_) {}
      out[c.colId] = { type:c.type, wo, isFormula:c.isFormula, formula:c.formula };
    });
    return out;
  } catch(e) { return {}; }
}

async function loadLists() {
  const act = async (table, re) => {
    try {
      const t = await grist.docApi.fetchTable(table), ks = Object.keys(t);
      const c = pick(ks, re), a = pick(ks, /^actif$/);
      const all = rows(t).map(r => ({id:r.id, name:String(r[c] ?? ''), actif: a ? truthy(r[a]) : true}))
        .sort((x,y)=>coll.compare(x.name,y.name));
      return {list: all.filter(x => x.actif && x.name), all, c, a};
    } catch(e) { return {list:[], all:[], c:null, a:null}; }
  };
  const [u, c] = await Promise.all([act('Utilisateurs', /^utilisateur$/), act('Chantiers', /^description$/)]);
  state.users = u.list; state.chantiers = c.list; state.usersAll = u.all; state.chantiersAll = c.all;
  state.uCols = {c:u.c, a:u.a}; state.cCols = {c:c.c, a:c.a};
}

async function loadCats() {
  state.cats = null;
  try {
    const id = (state.tableIds || []).find(t => norm(t) === 'categories');
    if (!id) return;
    const t = await grist.docApi.fetchTable(id), ks = Object.keys(t);
    state.cats = { rows: rows(t), valCol: pick(ks, /^validite?$/) };
  } catch(e) { state.cats = null; }
}
function validOf(m) {
  const c = state.cats; if (!c || !c.valCol) return '';
  const t = state.types.find(x => sameType(m, x));
  let row = t && t.catId != null ? c.rows.find(r => r.id === t.catId) : null;
  if (!row && m.cat) row = c.rows.find(r => Object.entries(r).some(([k,v]) => typeof v === 'string' && norm(v) && norm(v) === norm(m.cat)));
  const v = row ? row[c.valCol] : '';
  return v == null ? '' : String(v);
}

async function loadRules(pcCol) {
  state.pcStyle = null;
  try {
    if (!pcCol || !state.metaCols) return;
    const cols = state.metaCols;
    const col = cols.find(c => c.parentId === state.tableRef && c.colId === pcCol); if (!col) return;
    const ids = v => (Array.isArray(v) ? v : []).filter(x => typeof x === 'number');
    const parse = t => { try { return JSON.parse(t || '{}'); } catch(_) { return {}; } };
    let wo = parse(col.widgetOptions), rl = ids(col.rules);
    if (!rl.length) { // règles définies au niveau du champ de la vue
      const fl = rows(await grist.docApi.fetchTable('_grist_Views_section_field')).filter(f => f.colRef === col.id && ids(f.rules).length);
      if (fl.length) { rl = ids(fl[0].rules); wo = parse(fl[0].widgetOptions); }
    }
    const ro = wo.rulesOptions || [];
    const rules = rl.map((id,i) => ({helper: (cols.find(c => c.id === id) || {}).colId, fill: (ro[i]||{}).fillColor, text: (ro[i]||{}).textColor})).filter(r => r.helper && r.fill);
    const f = (wo.fillColor || '').toLowerCase();
    state.pcStyle = { rules, base: (f && f !== '#ffffff') ? {fill: wo.fillColor, text: wo.textColor} : null };
  } catch(e) { state.pcStyle = null; }
}
const pcOf = row => {
  const st = state.pcStyle; if (!st) return null;
  for (const r of st.rules) if (truthy(row[r.helper])) return {fill:r.fill, text:r.text};
  return st.base;
};

async function load(rawRecords) {
  try {
    const [rend, typeTbl] = await Promise.all([
      grist.fetchSelectedTable({format:'rendered', includeColumns:'normal'}),
      grist.docApi.fetchTable('Type_materiel')
    ]);
    const rr = rows(rend), byId = new Map(rr.map(r=>[r.id,r]));
    const mc = mapCols(Object.keys(rend), M);
    state.mc = mc; state.meta = await loadMeta();
    state.etatColors = ((state.meta[mc.etat] || {}).wo || {}).choiceOptions || {};
    await loadRules(mc.pc);
    let allById = new Map();
    if (state.pcStyle && state.pcStyle.rules.length) {
      try { allById = new Map(rows(await grist.fetchSelectedTable({includeColumns:'all'})).map(r => [r.id, r])); } catch(_) {}
    }
    const raw = rawRecords || rows(await grist.fetchSelectedTable({includeColumns:'normal'}));
    state.mats = raw.map(r => {
      const d = byId.get(r.id) || {}, g = k => mc[k] ? d[mc[k]] : '';
      const n = mc.des ? Number(r[mc.des]) : NaN;
      return { id:r.id, desId: (mc.des && r[mc.des] !== null && r[mc.des] !== '' && !isNaN(n)) ? n : null,
        des:g('des'), cat:g('cat'), num:g('num'), marque:g('marque'), serie:g('serie'), etat:g('etat'),
        user:g('user'), chantier:g('chantier'), mes:g('mes'), dc:g('dc'), pc:g('pc'), dmd:g('dmd'), dr:g('dr'), du:g('du'),
        libre: mc.libre ? truthy(r[mc.libre]) : false, raw:r, ac: mc.ac ? truthy(r[mc.ac]) : false, ex: mc.ex ? truthy(r[mc.ex]) : false, pcStyle: pcOf(allById.get(r.id) || {}),
        all: norm(Object.entries(d).filter(([k])=>k!=='id').map(([,v])=>v).join(' ')) };
    });
    const tc = mapCols(Object.keys(typeTbl), T);
    const catByType = new Map();
    state.mats.forEach(m => { if (m.desId != null && m.cat) catByType.set(m.desId, m.cat); });
    state.types = rows(typeTbl).map(r => ({
      id:r.id, des:r[tc.des] ?? '', catId: (tc.cat && typeof r[tc.cat] === 'number') ? r[tc.cat] : null,
      cat: String((tc.catTxt && r[tc.catTxt]) || catByType.get(r.id) || (tc.cat && typeof r[tc.cat] === 'string' ? r[tc.cat] : '') || '—'),
      total: tc.total ? r[tc.total] : state.mats.filter(m=>m.desId===r.id).length,
      dispo: tc.dispo ? r[tc.dispo] : state.mats.filter(m=>m.desId===r.id && m.libre).length
    }));
    await Promise.all([loadLists(), loadCats()]);
    render();
  } catch(e) { $('types').innerHTML = `<tr><td colspan=3 class="empty">Erreur : ${esc(e.message)}</td></tr>`; }
}

function badge(v, colors) {
  if (!v) return '';
  const o = (colors || state.etatColors)[v] || {};
  const st = (o.fillColor ? `background:${esc(o.fillColor)};` : '') + (o.textColor ? `color:${esc(o.textColor)};` : '');

let pillSig = '';
function moveSlider() {
  const on = $('pills').querySelector('.pill.on'), s = $('slider');
  if (!on) { s.style.opacity = 0; return; }
  s.style.opacity = 1;
  s.style.width = on.offsetWidth + 'px';
  s.style.height = on.offsetHeight + 'px';
  s.style.transform = `translate(${on.offsetLeft}px,${on.offsetTop}px)`;
}

function dateFmt(m, k) {
  try {
    const col = (state.mc || {})[k]; if (!col) return m[k];
    const v = m.raw[col], t = ((state.meta || {})[col] || {}).type || '';
    const opt = {day:'2-digit', month:'2-digit', year:'numeric'};
    if (typeof v === 'number' && v && /^Date/.test(t)) {
      const tz = /^DateTime/.test(t) ? (t.split(':')[1] || undefined) : 'UTC';
      return new Date(v * 1000).toLocaleDateString('fr-FR', {...opt, timeZone: tz});
    }
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10).split('-').reverse().join('/');
  } catch(e) {}
  const r = String(m[k] ?? '').trim();
  const iso = r.match(/^(\d{4})-(\d{2})-(\d{2})/);       // texte déjà rendu par Grist (AAAA-MM-JJ)
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  const dm = r.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);   // JJ-MM-AAAA, JJ.MM.AAAA...
  if (dm) return `${dm[1].padStart(2,'0')}/${dm[2].padStart(2,'0')}/${dm[3]}`;
  return r;
}

const warnOn = () => !!(state.fEch || state.fExp);
const passWarn = m => !warnOn() || (state.fEch && m.ac) || (state.fExp && m.ex);

function render() {
  const cats = ['TOUS', ...[...new Set(state.types.map(t=>t.cat))].sort()];
  if (!cats.includes(state.cat)) state.cat = 'TOUS';
  const sig = cats.join('|');
  if (sig !== pillSig) {
    pillSig = sig;
    [...$('pills').querySelectorAll('.pill')].forEach(b=>b.remove());
    $('pills').insertAdjacentHTML('beforeend', cats.map(c=>`<button class="pill" data-c="${esc(c)}">${esc(c)}</button>`).join(''));
  }
  [...$('pills').querySelectorAll('.pill')].forEach(b => b.classList.toggle('on', b.dataset.c === state.cat));
  requestAnimationFrame(moveSlider);

  const q = norm(state.q);
  const hit = m => m.all.includes(q);
  const types = state.types
    .filter(t => state.cat==='TOUS' || t.cat===state.cat)
    .filter(t => !state.dispoOnly || t.dispo>0)
    .filter(t => !q || state.mats.some(m => sameType(m,t) && hit(m)))
    .filter(t => !warnOn() || state.mats.some(m => sameType(m,t) && passWarn(m)));
  if (state.type && !types.some(t=>t.id===state.type)) state.type = null;
  $('types').innerHTML = types.map(t=>`<tr data-id="${t.id}" class="${t.id===state.type?'sel':''}">

  const selType = state.types.find(t=>t.id===state.type);

    .sort((a,b) => coll.compare(String(a.num ?? ''), String(b.num ?? '')) || a.id - b.id);

    || '<tr><td colspan=7 class="empty">Aucun matériel</td></tr>';

  const m = state.mats.find(x=>x.id===state.mat);
  const f = (l,v,st)=>`<div><label>${l}</label><div class="v" ${st ? `style="${st}"` : ''}>${esc(v)}</div></div>`;
  const pst = m && m.pcStyle ? `background:${esc(m.pcStyle.fill)};${m.pcStyle.text ? 'color:' + esc(m.pcStyle.text) + ';' : ''}` : '';
  $('side').innerHTML = m
    ? f('Date mise à dispo',dateFmt(m,'dmd'))+f('Dernier utilisateur',m.du)+f('Date retour',dateFmt(m,'dr'))+'<hr>'+f('Mise en service',dateFmt(m,'mes'))+f('Dernier contrôle',dateFmt(m,'dc'))
      +`<div class="pcrow"><div><label>Prochain contrôle</label><div class="v" ${pst ? `style="${pst}"` : ''}>${esc(dateFmt(m,'pc'))}</div></div><div><label>Validité</label><input type="text" class="ro" readonly value="${esc(validOf(m))}"></div></div>`
      +'<hr><button type="button" class="okb" id="okbtn">Matériel contrôlé</button><div class="bottom"><hr><button type="button" class="del" id="delbtn">Supprimer ce matériel</button></div>'
    : '<div class="empty">Sélectionnez un matériel</div>';
}

function inputFor(k, col, v, m) {
  const mt = (state.meta || {})[col] || {type:'Text', wo:{}};
  const dis = (mt.isFormula && mt.formula) ? 'disabled' : '';
  const lock = (['des','num','marque','serie'].includes(k) && !dis) ? 'disabled data-lock="1"' : '';
  const base = `data-k="${k}" data-col="${esc(col)}" ${dis} ${lock}`;
  const t = mt.type || 'Text';
  if (k === 'des' || /^Ref:/.test(t)) {
    const opts = [...state.types].sort((a,b)=>coll.compare(String(a.des),String(b.des)));
    const cur = state.types.find(t => sameType(m, t));
    const curId = cur ? cur.id : Number(v);
    return `<select ${base} data-t="Ref"><option value="0"></option>` +
      opts.map(o=>`<option value="${o.id}" ${o.id===curId?'selected':''}>${esc(o.des)}</option>`).join('') + '</select>';
  }
  if (t === 'Choice') {
    const ch = (mt.wo.choices || []).slice(); if (v && !ch.includes(v)) ch.push(v);
    const cols = mt.wo.choiceOptions || {};
    return `<div class="cp" ${base.replace('disabled','data-dis="1"')} data-t="Choice" data-val="${esc(v ?? '')}">
      <button type="button" class="cur">${badge(v, cols) || '&nbsp;'}</button>
      <div class="lst"><div class="opt" data-v="">&nbsp;</div>${ch.map(c=>`<div class="opt" data-v="${esc(c)}">${badge(c, cols)}</div>`).join('')}</div></div>`;
  }
  if (t === 'Bool') return `<input type="checkbox" ${base} data-t="Bool" ${truthy(v)?'checked':''}>`;
  if (t === 'Int' || t === 'Numeric') return `<input type="number" step="any" ${base} data-t="Num" value="${esc(v ?? '')}">`;
  if (t === 'Date') return `<input type="date" ${base} data-t="Date" value="${typeof v==='number' ? new Date(v*1000).toISOString().slice(0,10) : ''}">`;
  return `<input type="text" ${base} data-t="Text" value="${esc(v ?? '')}">`;
}

async function doAffecter() {
  const m = state.mats.find(x=>x.id===editId); if (!m) return;
  const mc = state.mc || {}, meta = state.meta || {};
  const u = state.users.find(x=>String(x.id)===$('affu').value), c = state.chantiers.find(x=>String(x.id)===$('affc').value);
  const d = $('affdate').value;
  const isRef = col => /^Ref:/.test((meta[col] || {}).type || '');
  const isNum = col => /^Date(Time)?/.test((meta[col] || {}).type || '');
  const fields = {};
  if (u && mc.user) fields[mc.user] = isRef(mc.user) ? u.id : u.name;
  if (c && mc.chantier) fields[mc.chantier] = isRef(mc.chantier) ? c.id : c.name;
  if (d && mc.dmd) fields[mc.dmd] = isNum(mc.dmd) ? Date.parse(d + 'T00:00:00Z') / 1000 : d;
  try { await grist.selectedTable.update({id: editId, fields}); $('dlg').classList.remove('aff-on'); $('affbtn').textContent = 'Affecter'; closeEdit(); }
  catch(e) { $('err').textContent = 'Erreur : ' + (e.message || e); }
}

async function doRetour() {
  const m = state.mats.find(x=>x.id===editId); if (!m) return;
  const mc = state.mc || {}, meta = state.meta || {}, d = $('dret').value;
  const isRef = c => /^Ref:/.test((meta[c] || {}).type || '');
  const isNum = c => /^Date(Time)?/.test((meta[c] || {}).type || '');
  const fields = {};
  if (mc.user) fields[mc.user] = isRef(mc.user) ? 0 : '';
  if (mc.chantier) fields[mc.chantier] = isRef(mc.chantier) ? 0 : '';
  if (mc.dr) fields[mc.dr] = isNum(mc.dr) ? Date.parse(d + 'T00:00:00Z') / 1000 : d;
  if (mc.du) fields[mc.du] = isRef(mc.du) ? (m.raw[mc.user] || 0) : m.user;
  try { await grist.selectedTable.update({id: editId, fields}); closeEdit(); }
  catch(e) { $('err').textContent = 'Erreur : ' + (e.message || e); }
}

function closeEdit() { $('modal').classList.remove('open'); editId = null; }

async function saveEdit() {
  const m = state.mats.find(x=>x.id===editId); if (!m) return closeEdit();
  const fields = {};
  $('dlg').querySelectorAll('[data-k]').forEach(el => {
    if (el.disabled || el.dataset.dis === '1') return;
    const col = el.dataset.col, t = el.dataset.t, old = m.raw[col];
    let val;
    if (t === 'Ref') val = Number(el.value) || 0;
    else if (t === 'Choice') val = el.dataset.val || '';
    else if (t === 'Bool') val = el.checked;
    else if (t === 'Num') val = el.value === '' ? null : Number(el.value);
    else if (t === 'Date') val = el.value ? Date.parse(el.value + 'T00:00:00Z') / 1000 : null;
    else val = el.value;
    if (String(val ?? '') !== String(old ?? '')) fields[col] = val;
  });
  if (!Object.keys(fields).length) return closeEdit();
  try { await grist.selectedTable.update({id: editId, fields}); closeEdit(); }
  catch(e) { $('err').textContent = 'Erreur : ' + (e.message || e); }
}

});

    $('uct' + k).innerHTML = ucList(k).map(r => `<tr data-id="${r.id}" class="${r.id === UC[k].sel ? 'sel' : ''}">
      <td>${esc(r.name)}</td><td class="n"><input type="checkbox" data-id="${r.id}" ${r.actif ? 'checked' : ''}></td></tr>`).join('')
      || '<tr><td colspan="2" class="empty">Aucun élément</td></tr>';
  });
}

async function openUC() {
  await loadLists();
  UC.u.sel = UC.c.sel = null;
  $('dlg3').innerHTML = `<div class="hd"><h3>Utilisateurs &amp; Chantiers</h3></div>
    <div class="uc">${['u','c'].map(k => `<div><h4>${UC[k].title}</h4><div class="lst3">
      <div class="btnc"><button type="button" data-act="add" data-k="${k}" title="Ajouter">+</button><button type="button" data-act="del" data-k="${k}" title="Supprimer la ligne sélectionnée">−</button></div>
      <div class="tbl" data-k="${k}"><table><thead><tr><th>${UC[k].head}</th><th class="n">Actif</th></tr></thead><tbody id="uct${k}"></tbody></table></div>
    </div></div>`).join('')}</div>
    <div class="err" id="ucerr"></div>
    <hr><div class="btns"><button type="button" class="pri" id="ucclose">Fermer</button></div>`;
  $('modal3').classList.add('open');
  $('ucclose').onclick = () => $('modal3').classList.remove('open');
  renderUC();
}

function askDelUC(k) {
  const r = ucList(k).find(x => x.id === UC[k].sel);
  if (!r) { $('ucerr').textContent = 'Sélectionnez d’abord une ligne à supprimer.'; return; }
  $('ucerr').textContent = '';
  $('dlg2').innerHTML = `<h3 style="margin:0 0 10px;font-size:15px">Supprimer ${k === 'u' ? 'l’utilisateur' : 'le chantier'}</h3>
    <p style="margin:0">Supprimer <b>${esc(r.name)}</b> ? Cette action est irréversible.</p>
    <div class="err" id="err2"></div>
    <div class="btns"><button type="button" id="no">Annuler</button><button type="button" class="danger" id="yes">Supprimer</button></div>`;
  $('modal2').classList.add('open');
  $('no').onclick = () => $('modal2').classList.remove('open');
  $('yes').onclick = async () => {
    try { await grist.getTable(UC[k].table).destroy(r.id); await loadLists(); UC[k].sel = null; renderUC(); $('modal2').classList.remove('open'); }
    catch(e) { $('err2').textContent = 'Erreur : ' + (e.message || e); }
  };
  $('no').focus();
}

$('dlg3').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b) {
    const k = b.dataset.k;
    if (b.dataset.act === 'add') openAdd(k, nid => { UC[k].sel = nid; renderUC(); });
    else askDelUC(k);
    return;
  }
  const tr = e.target.closest('tr[data-id]');
  if (tr && e.target.type !== 'checkbox') {
    const k = tr.closest('.tbl').dataset.k;
    UC[k].sel = Number(tr.dataset.id);
    tr.parentElement.querySelectorAll('tr').forEach(x => x.classList.toggle('sel', x === tr));
  }
});
$('dlg3').addEventListener('change', async e => {
  const cb = e.target; if (cb.type !== 'checkbox') return;
  const k = cb.closest('.tbl').dataset.k, cols = k === 'u' ? state.uCols : state.cCols;
  try {
    await grist.getTable(UC[k].table).update({id: Number(cb.dataset.id), fields: {[cols.a || 'Actif']: cb.checked}});
    await loadLists();
  } catch(err) {
    $('ucerr').textContent = 'Erreur : ' + (err.message || err);
    await loadLists(); renderUC();
  }
});
$('modal3').addEventListener('mousedown', e => { if (e.target === $('modal3')) $('modal3').classList.remove('open'); });
$('btnUC').onclick = openUC;

function openAddMat() {
  const mc = state.mc || {};
  const f = (k, l, html) => mc[k] ? `<div class="f"><label>${l}</label>${html}</div>` : '';
  const types = [...state.types].sort((a,b) => coll.compare(String(a.des), String(b.des)));
  const des = `<select id="nm-des"><option value="0"></option>${types.map(t => `<option value="${t.id}" ${t.id === state.type ? 'selected' : ''}>${esc(t.des)}</option>`).join('')}</select>`;
  const txt = id => `<input type="text" id="${id}">`;
  const etat = mc.etat ? cpHtml(mc.etat, 'NEUF', 'nm-etat').replace('class="cp"', 'class="cp up"') : '';
  $('dlg4').innerHTML = `<div class="hd"><h3>Ajouter un matériel</h3></div>
    ${f('des','Désignation',des)}${f('num','N°',txt('nm-num'))}
    <div class="row2">${f('marque','Marque',txt('nm-marque'))}${f('serie','N° série',txt('nm-serie'))}</div>
    ${f('etat','État',etat)}${f('mes','Mise en service',`<input type="date" id="nm-mes" value="${todayStr()}">`)}
    <div class="err" id="nm-err"></div>
    <hr><div class="btns"><button type="button" id="nm-cancel">Annuler</button><button type="button" class="pri" id="nm-ok">Ajouter</button></div>`;
  $('modal4').classList.add('open');
  $('nm-cancel').onclick = () => $('modal4').classList.remove('open');
  $('nm-ok').onclick = saveAddMat;
  const first = $('dlg4').querySelector('select,input'); if (first) first.focus();
}

async function saveAddMat() {
  const mc = state.mc || {}, meta = state.meta || {};
  const val = id => ($(id) ? $(id).value.trim() : '');
  const typ = k => ((meta[mc[k]] || {}).type || '');
  const conv = (k, v) => /^(Int|Numeric)$/.test(typ(k)) ? Number(v) : v;
  const desId = Number(val('nm-des')) || 0;
  if (mc.des && !desId) { $('nm-err').textContent = 'Choisissez une désignation.'; return; }
  const fields = {};
  if (mc.des) fields[mc.des] = desId;
  [['num','nm-num'],['marque','nm-marque'],['serie','nm-serie']].forEach(([k, id]) => { const v = val(id); if (mc[k] && v !== '') fields[mc[k]] = conv(k, v); });
  if (mc.etat && $('nm-etat') && $('nm-etat').dataset.val) fields[mc.etat] = $('nm-etat').dataset.val;
  const d = val('nm-mes');
  if (mc.mes && d) fields[mc.mes] = /^Date(Time)?/.test(typ('mes')) ? Date.parse(d + 'T00:00:00Z') / 1000 : d;
  try {
    const res = await grist.selectedTable.create({fields});
    const nid = res && (res.id ?? (Array.isArray(res) ? (res[0] || {}).id : undefined));
    if (nid != null) state.mat = nid;
    $('modal4').classList.remove('open');
  } catch(e) { $('nm-err').textContent = 'Erreur : ' + (e.message || e); }
}
$('dlg4').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') saveAddMat(); });
$('btnAdd').onclick = openAddMat;

function openPrint() {
  const list = state.shown || [];
  const body = list.map(m => `<tr class="${m.libre ? 'free' : ''}"><td>${esc(m.num)}</td><td>${esc(m.des)}</td><td>${esc(m.marque)}</td><td>${esc(m.serie)}</td>
    <td>${badge(m.etat)}</td><td>${esc(m.user)}</td><td>${esc(m.chantier)}</td><td>${esc(dateFmt(m,'pc'))}</td></tr>`).join('')
    || '<tr><td colspan="8" class="empty">Aucune ligne</td></tr>';
  const today = new Date().toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
  $('dlg5').innerHTML = `<div class="hd noprint"><h3>Aperçu avant impression</h3></div>
    <div class="sheet">
      <input type="text" class="ptitle" id="ptitle" value="Liste du matériel au ${today}">
      <div class="pcount">${list.length} matériel${list.length > 1 ? 's' : ''}</div>
      <table><thead><tr><th>N°</th><th>Désignation</th><th>Marque</th><th>N° série</th><th>État</th><th>Utilisateur</th><th>Chantier</th><th>Prochain contrôle</th></tr></thead>
      <tbody>${body}</tbody></table>
    </div>
    <div class="err noprint" id="perr"></div>
    <hr class="noprint">
    <div class="btns noprint"><button type="button" id="pclose">Fermer</button><button type="button" class="pri" id="pprint">Imprimer</button></div>`;
  $('modal5').classList.add('open');
  $('pclose').onclick = () => $('modal5').classList.remove('open');
  $('pprint').onclick = () => {
    try { window.print(); }
    catch(e) { $('perr').textContent = 'L’impression est bloquée par le navigateur : ' + (e.message || e); }
  };
}
$('btnPrint').onclick = openPrint;

function askControle() {
  const m = state.mats.find(x=>x.id===state.mat); if (!m) return;
  $('dlg2').innerHTML = `<h3 style="margin:0 0 10px;font-size:15px">Matériel contrôlé — ${esc(m.num)}</h3>
    <div class="f"><label>Date de contrôle</label><input type="date" id="dctl" value="${todayStr()}"></div>
    ${(state.mc || {}).etat ? `<div class="f"><label>État</label>${cpHtml(state.mc.etat, m.raw[state.mc.etat], 'ctlEtat')}</div>` : ''}
    <div class="err" id="err2"></div>
    <div class="btns"><button type="button" id="no">Annuler</button><button type="button" class="pri" id="yes">Valider</button></div>`;
  $('modal2').classList.add('open');
  $('no').onclick = () => $('modal2').classList.remove('open');
  $('yes').onclick = async () => {
    const d = $('dctl').value, mc = state.mc || {}, t = ((state.meta || {})[mc.dc] || {}).type || '';
    if (!d) { $('err2').textContent = 'Choisissez une date.'; return; }
    if (!mc.dc) { $('err2').textContent = 'Colonne « Dernier contrôle » introuvable.'; return; }
    const val = /^Date(Time)?/.test(t) ? Date.parse(d + 'T00:00:00Z') / 1000 : d;
    const fields = {[mc.dc]: val};
    if (mc.etat && $('ctlEtat')) { const ne = $('ctlEtat').dataset.val || ''; if (ne !== String(m.raw[mc.etat] ?? '')) fields[mc.etat] = ne; }
    try { await grist.selectedTable.update({id: m.id, fields}); $('modal2').classList.remove('open'); }
    catch(e) { $('err2').textContent = 'Erreur : ' + (e.message || e); }
  };
  $('dctl').focus();
}
$('side').addEventListener('click', e => {
  if (e.target.closest('#delbtn')) askDelete();
  else if (e.target.closest('#okbtn')) askControle();
});

document.addEventListener('click', e => {
  if (e.target.closest('.modal')) return;
  const pill = e.target.closest('.pill'), tr = e.target.closest('tbody tr[data-id]');
  if (pill) { state.cat = pill.dataset.c; state.type = null; render(); }
  else if (tr) {
    const id = Number(tr.dataset.id);
    if (tr.parentElement.id === 'types') state.type = state.type===id ? null : id;
    else {
      const now = Date.now();
      const dbl = lastClick.id === id && now - lastClick.t < 450;
      lastClick = dbl ? {id:null,t:0} : {id, t:now};
      state.mat = id; try { grist.setCursorPos({rowId:id}); } catch(_){}
      if (dbl) { render(); openEdit(id); return; }
    }
    render();
  }
});
$('dispo').addEventListener('change', e => { state.dispoOnly = e.target.checked; render(); });
$('fech').addEventListener('change', e => { state.fEch = e.target.checked; render(); });
$('fexp').addEventListener('change', e => { state.fExp = e.target.checked; render(); });
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
new ResizeObserver(() => moveSlider()).observe($('pills'));
window.addEventListener('resize', moveSlider);

grist.ready({ requiredAccess:'full' });
grist.onRecords(recs => load(recs));
</script>
</body>
</html>
